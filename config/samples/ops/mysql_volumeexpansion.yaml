apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  generateName: mysql-volumeexpansion-
  namespace: default
spec:
  clusterName: wesql
  type: VolumeExpansion
  volumeExpansion:
  - componentName: wesql
    volumeClaimTemplates:
    - name: data
      storage: "2Gi"
    # Optional: target a named instance template. This takes precedence over
    # the component-level target for the same volumeClaimTemplate.
    instances:
    - name: canary
      volumeClaimTemplates:
      - name: data
        storage: "3Gi"
