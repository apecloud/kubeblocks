apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  generateName: mysql-volumeexpansion-
  namespace: default
spec:
  clusterName: wesql
  type: VolumeExpansion
  volumeExpansion:
  - componentName: wesql
    volumeClaimTemplates:
    - name: data
      storage: "2Gi"
    # Optional: if the component has an instance template named "az-a", add:
    # instances:
    # - name: az-a
    #   volumeClaimTemplates:
    #   - name: data
    #     storage: "3Gi"
