# The Cluster must already define an instance template named "large" in component "mysql".
# Both data and logs must already exist in the component or named instance template.
# componentName can also name a sharding; the request then applies to every shard.
apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  generateName: mysql-volumeexpansion-instances-
  namespace: default
spec:
  clusterName: mycluster
  type: VolumeExpansion
  volumeExpansion:
  - componentName: mysql
    # Optional: expand the component default and templates inheriting this volume.
    # Existing instance-template volume overrides remain unchanged unless listed below.
    volumeClaimTemplates:
    - name: data
      storage: 20Gi
    - name: logs
      storage: 10Gi
    # Omit volumeClaimTemplates above to expand only the named instance templates.
    instances:
    - name: large
      volumeClaimTemplates:
      - name: data
        storage: 40Gi
      - name: logs
        storage: 20Gi
