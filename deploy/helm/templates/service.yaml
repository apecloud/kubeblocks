{{- if .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeblocks.svcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "kubeblocks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.serviceMonitor.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
      {{- if and (eq .Values.service.type "NodePort") (not (empty .Values.serviceMonitor.nodePort)) }}
      nodePort: {{ .Values.serviceMonitor.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/component: "apps"
    {{- include "kubeblocks.selectorLabels" . | nindent 4 }}
{{- end }}
