apiVersion: apps.kubeblocks.io/v1alpha1
kind: Rollout
metadata:
  name: mysql-create-8038
  namespace: ${TEST_NAMESPACE}
spec:
  clusterName: ${MYSQL_CLUSTER}
  components:
    - name: mysql
      compDef: ${MYSQL_COMPDEF}
      serviceVersion: "${MYSQL_VERSION_CANARY}"
      replicas: 1
      strategy:
        create:
          canary: true
          promotion:
            auto: true
            delaySeconds: ${ROLLOUT_CREATE_PROMOTION_DELAY_SECONDS}
            scaleDownDelaySeconds: ${ROLLOUT_CREATE_SCALE_DOWN_DELAY_SECONDS}
      instanceMeta:
        canary:
          labels:
            traffic: canary
          annotations:
            rollout.apps.kubeblocks.io/version: "${MYSQL_VERSION_CANARY}"
