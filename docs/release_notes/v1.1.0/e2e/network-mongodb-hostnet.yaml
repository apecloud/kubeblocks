apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: network-mongodb-hostnet
  namespace: ${TEST_NAMESPACE}
spec:
  terminationPolicy: Delete
  clusterDef: mongodb
  topology: replicaset
  componentSpecs:
    - name: mongodb
      serviceVersion: "${MONGO_VERSION}"
      replicas: 1
      network:
        hostNetwork: true
      resources:
        limits:
          cpu: "0.5"
          memory: 0.5Gi
        requests:
          cpu: "0.5"
          memory: 0.5Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: "${MONGO_NETWORK_STORAGE_CLASS}"
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
