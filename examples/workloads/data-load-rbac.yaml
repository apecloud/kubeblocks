# Apply this file in the same namespace as the InstanceSet and its runtime PVCs.
# This ServiceAccount works without Component or Apps controller RBAC builders.
# Set spec.template.spec.serviceAccountName: workloads-data-loader and
# spec.template.spec.automountServiceAccountToken: true on the InstanceSet.
# For ITS2 placement in another cluster, apply this file in the runtime cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workloads-data-loader
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workloads-data-loader
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workloads-data-loader
subjects:
- kind: ServiceAccount
  name: workloads-data-loader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workloads-data-loader
